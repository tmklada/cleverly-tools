<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="HomePure placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2233"/>
      <stop offset="1" stop-color="#1e4b66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#79c6e6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#79c6e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8c7333"/>
      <stop offset="0.5" stop-color="#c9a961"/>
      <stop offset="1" stop-color="#e9d9a8"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <circle cx="620" cy="440" r="180" fill="#79c6e6" opacity="0.35" filter="url(#blur)"/>
  <circle cx="180" cy="120" r="140" fill="#ffffff" opacity="0.18" filter="url(#blur)"/>
  <g transform="translate(400 300)">
    <rect x="-120" y="-120" width="240" height="240" rx="48" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.35"/>
    <rect x="-100" y="-100" width="200" height="200" rx="40" fill="url(#gold)" fill-opacity="0.85"/>
    <text x="0" y="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0b0b0f" letter-spacing="2">HomePure</text>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.6" letter-spacing="6">PRODUCT IMAGE PLACEHOLDER</text>
</svg>
